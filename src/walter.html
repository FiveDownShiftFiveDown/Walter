<title>Walter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F2F4F1; --panel:#FFFFFF; --panel-2:#E9EDE9; --ink:#1B2220; --muted:#5B6661; --line:#D5DBD6;
  --accent:#1F5F8B; --accent-ink:#FFFFFF; --accent-bg:#E1ECF4; --save:#2B7A4B; --save-bg:#E2F1E7;
  --est:#95600F; --est-bg:#F6EAD4; --bad:#A33A2A; --bad-bg:#F6E1DD; --track-extra:#A9C8DD;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4;
  --display:"Archivo",ui-sans-serif,system-ui,sans-serif;
  --body:"Public Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#111514; --panel:#191F1D; --panel-2:#212826; --ink:#E5EAE7; --muted:#99A39E; --line:#2E3734;
    --accent:#7AB2DC; --accent-ink:#0E1A22; --accent-bg:#1C2D3A; --save:#62C58E; --save-bg:#17301F;
    --est:#E3AB55; --est-bg:#35291A; --bad:#E27D6B; --bad-bg:#3A1F1A; --track-extra:#2F5673;
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#111514; --panel:#191F1D; --panel-2:#212826; --ink:#E5EAE7; --muted:#99A39E; --line:#2E3734;
  --accent:#7AB2DC; --accent-ink:#0E1A22; --accent-bg:#1C2D3A; --save:#62C58E; --save-bg:#17301F;
  --est:#E3AB55; --est-bg:#35291A; --bad:#E27D6B; --bad-bg:#3A1F1A; --track-extra:#2F5673;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:20px 112px;display:flex;flex-direction:column;gap:20px}
.wrap.setup{padding-block:20px 28px;min-height:100%}
h1,h2,h3{margin:0;font-family:var(--display);text-wrap:balance;letter-spacing:-.01em}
h1{font-stretch:80%;font-weight:800;font-size:34px;line-height:1.02}
h1.hero{font-size:44px;line-height:.95;font-stretch:78%}
h2{font-stretch:85%;font-weight:750;font-size:22px;line-height:1.1}
h3{font-stretch:88%;font-weight:700;font-size:18px;line-height:1.15}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pagehead{display:flex;flex-direction:column;gap:8px}
.pagehead .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.rule{height:2px;background:var(--ink)}
.stack{display:flex;flex-direction:column;gap:12px}
.stack.tight{gap:8px}
.stack.loose{gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.accent{border:2px solid var(--accent)}
.card.warn{border:1px solid var(--est);background:var(--est-bg)}
.card.quiet{background:var(--panel-2);border-color:transparent}
.card.flush{padding:0;gap:0;overflow:hidden}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:8px;background:var(--accent-bg);font-size:14px;line-height:1.45}
.note svg{flex-shrink:0;margin-top:2px;color:var(--accent)}
.note.good{background:var(--save-bg)} .note.good svg{color:var(--save)}
.note.warn{background:var(--est-bg)} .note.warn svg{color:var(--est)}
.note.bad{background:var(--bad-bg)} .note.bad svg{color:var(--bad)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 18px;border-radius:8px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:17px;text-decoration:none}
.btn.full{width:100%}
.btn.sm{min-height:44px;font-size:15px;padding:0 14px}
.btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--accent);min-height:44px;padding:0 8px;font-size:15px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;flex-shrink:0;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink)}
.iconbtn.plain{border-color:transparent;color:var(--muted)}
.iconbtn.armed{border-color:var(--bad);color:var(--bad)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow > .btn{flex:1 1 140px}

/* chips + tags */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--panel);font-size:15px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink);font-weight:600}
.chip.add{border-style:dashed;border-color:var(--muted)}
.tag{display:inline-block;font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:2px 6px;vertical-align:2px;white-space:nowrap}
.tag.est{color:var(--est);background:var(--est-bg)}
.tag.good{color:var(--save);background:var(--save-bg)}
.tag.info{color:var(--accent);background:var(--accent-bg)}
.tag.warn{color:var(--est);background:var(--est-bg)}
.tag.bad{color:var(--bad);background:var(--bad-bg)}
.tag.quiet{color:var(--muted);background:var(--panel-2)}
button.tag{border:0;cursor:pointer;min-height:26px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--panel-2);border-radius:8px;padding:3px;gap:3px}
.seg button{min-height:40px;border:0;background:transparent;border-radius:6px;font-weight:600;font-size:14px;color:var(--muted);padding:4px 8px;line-height:1.2}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* setup */
.stephead{display:flex;flex-direction:column;gap:12px}
.stephead .top{display:flex;align-items:center;justify-content:space-between}
.stephead .mid{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase}
.stephead .mid b{font-size:12px;font-weight:600}
.stephead .mid span{font-size:11px;color:var(--muted)}
.segs{display:grid;gap:4px}
.segs i{display:block;height:6px;border-radius:2px;background:var(--line)}
.segs i.on{background:var(--accent)}
.lead{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.lead p{color:var(--muted);font-size:15px}
.option{display:flex;align-items:center;gap:14px;min-height:60px;padding:12px 16px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;width:100%}
.option .dot{flex-shrink:0;width:22px;height:22px;border:2px solid var(--muted);border-radius:50%}
.option[aria-checked="true"]{background:var(--accent-bg);border:2px solid var(--accent);padding:11px 15px}
.option[aria-checked="true"] .dot{border:7px solid var(--accent);background:var(--panel)}
.option .t{font-size:17px;font-weight:600;display:block}
.option .s{font-size:13px;color:var(--muted);display:block}
.pathcard{display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:8px;width:100%}
.pathcard[aria-pressed="true"]{border:2px solid var(--accent);padding:15px}
.pathcard .hd{display:flex;align-items:center;gap:10px}
.pathcard .badge{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:4px;background:var(--panel-2);font:600 13px var(--mono)}
.pathcard[aria-pressed="true"] .badge{background:var(--accent);color:var(--accent-ink)}
.pathcard .nm{flex:1;font-family:var(--display);font-stretch:88%;font-weight:700;font-size:20px}
.pathcard .tm{font:600 12px var(--mono);color:var(--muted)}
.pathcard[aria-pressed="true"] .tm{color:var(--accent)}
.pathcard .ds{font-size:14px;color:var(--muted);padding-left:36px}

/* fields */
.field{display:flex;flex-direction:column;gap:6px}
.field > label, .lbl{font-size:14px;font-weight:600}
.hint{font-size:13px;color:var(--muted)}
.inp{height:44px;width:100%;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--ground);font-size:16px}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent-bg)}
select.inp{padding-right:6px}
.money{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--ground);height:44px;padding-left:10px}
.money:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}
.money span{font-family:var(--mono);color:var(--muted);font-weight:600}
.money input{border:0;background:transparent;height:42px;width:100%;padding:0 10px 0 4px;font-family:var(--mono);font-weight:600;font-size:17px;text-align:right;outline:none;min-width:0}
.money.big{height:60px} .money.big input{font-size:28px;height:58px}
.money.big span{font-size:24px}
.pctbox{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--ground);height:44px;padding-right:10px}
.pctbox input{border:0;background:transparent;height:42px;width:100%;padding:0 4px 0 10px;font-family:var(--mono);font-weight:600;font-size:17px;text-align:right;outline:none;min-width:0}
.pctbox span{font-family:var(--mono);color:var(--muted);font-weight:600}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair.wide{grid-template-columns:1.4fr 1fr}
.linerow{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.linerow .top{display:flex;gap:8px;align-items:center}
.linerow .top .inp{flex:1;min-width:0}
.linerow .top .money{width:132px;flex-shrink:0}
.checkline{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px}
.checkline input{width:20px;height:20px;accent-color:var(--accent);flex-shrink:0}
.checkline.est input{accent-color:var(--est)}

/* ledger + bars */
.ledger{display:flex;flex-direction:column}
.ledger .ln{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.ledger .ln:last-child{border-bottom:0}
.ledger .ln.total{border-top:2px solid var(--ink);border-bottom:0;font-weight:700}
.ledger .v{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.ledger .ln.total .v{font-size:17px;font-weight:600;color:var(--save)}
.ledger .ln.total .v.neg,.neg{color:var(--bad)!important}
.bignum{font-family:var(--display);font-stretch:75%;font-weight:800;font-size:72px;line-height:.95;font-variant-numeric:tabular-nums;color:var(--save)}
.bignum.neg{color:var(--bad)}
.date-big{font-family:var(--display);font-stretch:78%;font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:3px;background:var(--panel-2);overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--save)}
.bar i.x{background:var(--track-extra)}
.bar i.over{background:var(--est)}
.bar.thin{height:6px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;align-items:baseline}
.kv .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
.split-line{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* goal cards */
.goal{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px}
.goal .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.goal .nm{font-weight:700;font-size:17px}
.goal .when{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.orderlist{display:flex;flex-direction:column}
.orderlist .oi{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.orderlist .oi:last-child{border-bottom:0}
.orderlist .n{font:600 12px var(--mono);color:var(--muted);width:22px}
.orderlist .t{flex:1;font-weight:600}

/* log */
.catrow{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.catrow:last-child{border-bottom:0}
.entries{display:flex;flex-direction:column}
.entry{display:grid;grid-template-columns:62px 1fr auto 44px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.entry:last-child{border-bottom:0}
.entry .d{font:500 12px var(--mono);color:var(--muted)}
.entry .c{font-size:12px;color:var(--muted);display:block}
.entry .a{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}

/* owed */
.owed{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.owed:last-child{border-bottom:0}

/* details */
details.sec{background:var(--panel);border:1px solid var(--line);border-radius:8px}
details.sec > summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;min-height:56px;cursor:pointer}
details.sec > summary::-webkit-details-marker{display:none}
details.sec > summary .t{font-weight:700;font-size:16px}
details.sec > summary .v{font-family:var(--mono);font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
details.sec > summary .chev{transition:transform .15s}
details.sec[open] > summary .chev{transform:rotate(180deg)}
details.sec .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar button{height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:0;color:var(--muted);font:600 11px var(--body);letter-spacing:.02em;position:relative}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar button[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tabbar .dotbadge{position:absolute;top:10px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--est)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:var(--ground);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .wrap{padding-block:20px 40px}
.stepno{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:4px;background:var(--ink);color:var(--ground);font:600 12px var(--mono);flex-shrink:0}
.sechd{display:flex;align-items:center;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
textarea.inp{height:auto;min-height:96px;padding:10px 12px;font-family:var(--mono);font-size:12px;line-height:1.4;resize:vertical;word-break:break-all}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.spacer{flex-grow:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:360px){ .bignum{font-size:60px} h1.hero{font-size:38px} .linerow .top .money{width:112px} }

/* compact density: more on one phone screen */
body{font-size:14px;line-height:1.4}
.wrap{gap:12px;padding-block:14px 84px;max-width:520px}
.wrap.setup{padding-block:14px 20px}
.tabbar .in{max-width:520px}
.stack{gap:8px} .stack.tight{gap:6px} .stack.loose{gap:12px}
.lead{gap:6px;padding-top:0} .lead p{font-size:14px}
.pagehead{gap:6px}
.card{padding:12px;gap:8px}
h1{font-size:26px} h1.hero{font-size:34px} h2{font-size:18px} h3{font-size:16px}
.bignum{font-size:48px} .date-big{font-size:28px}
.btn{min-height:44px;font-size:15px;padding:0 14px}
.btn.sm{min-height:36px;font-size:14px;padding:0 12px}
.btn.ghost{min-height:32px;font-size:14px;padding:0 6px}
.iconbtn{width:36px;height:36px}
.chip{min-height:34px;padding:0 12px;font-size:14px;border-radius:17px}
.seg{padding:2px;gap:2px} .seg button{min-height:32px;font-size:13px}
.inp{height:38px;font-size:15px}
.money{height:38px;padding-left:8px} .money input{height:36px;font-size:15px}
.money.big{height:46px} .money.big input{height:44px;font-size:22px} .money.big span{font-size:18px}
.pctbox{height:38px} .pctbox input{height:36px;font-size:15px}
.linerow{padding:8px 10px;gap:6px} .linerow .top .money{width:112px}
.checkline{min-height:32px;font-size:14px}
.option{min-height:48px;padding:8px 12px} .option[aria-checked="true"]{padding:7px 11px} .option .t{font-size:15px}
.pathcard{padding:12px} .pathcard[aria-pressed="true"]{padding:11px} .pathcard .nm{font-size:18px}
.ledger .ln{padding:6px 0;font-size:14px}
.note{padding:8px 10px;font-size:13px;gap:8px}
.kv{font-size:13px}
.tabbar button{height:52px;font-size:10.5px}
.tabbar .dotbadge{top:7px}
details.sec > summary{min-height:44px;padding:10px 12px}
details.sec > summary .t{font-size:15px}
details.sec .body{padding:0 12px 12px;gap:8px}
.catrow{padding:5px 0;gap:3px}
.entry{padding:2px 0;grid-template-columns:50px 1fr auto 36px;font-size:14px}
.owed{padding:6px 0}
.bar{height:8px} .bar.thin{height:5px}
.toast{bottom:calc(64px + env(safe-area-inset-bottom,0px))}
.stephead{gap:8px}

/* compact goal + debt rows */
.goal{padding:10px 12px;gap:8px}
.grow{display:flex;flex-direction:column;gap:5px;width:100%;background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer}
.grow .r1,.grow .r3{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.grow .nm{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.grow .fin{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:20px;white-space:nowrap;font-variant-numeric:tabular-nums}
.grow .r3{font-size:12.5px;color:var(--muted)}
.grow .r3 .v{font-family:var(--mono);font-variant-numeric:tabular-nums}
.gmore{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:8px}
.list{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column}
.list > .goal{border:0;border-radius:0;border-bottom:1px solid var(--line);background:transparent}
.list > .goal:last-child{border-bottom:0}
.list > form.card{border-radius:0;border-width:0 0 1px 0;margin:0}

/* calendar */
.tabbar .in{grid-template-columns:repeat(6,1fr)}
.tabbar button{font-size:10px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .dow{font:600 10px var(--mono);text-align:center;color:var(--muted);letter-spacing:.06em;padding-bottom:2px}

/* ---------- calendar engine ---------- */
function billWith(b){ return Array.isArray(b.withList) && b.withList.length ? b.withList : (b.with ? [b.with] : []); }

const WEEKLY_FACTOR = 52 / 12;
function paydaysIn(from, to){ const out = []; let w = payWindow(from); let p = w.last >= from ? w.last : w.next; let guard = 0; while (p <= to && guard++ < 400){ out.push(p); p = payWindow(p).next; } return out; }

  opts = opts || {};

  for (let y = a.getFullYear(), m = a.getMonth(); y < b.getFullYear() || (y === b.getFullYear() && m <= b.getMonth()); m === 11 ? (y++, m = 0) : m++){
    const at = day => iso(new Date(y, m, Math.min(day, dim(y, m))));
    state.bills.forEach(x => { if (x.freq !== 'weekly' && x.due && billAmt(x) > 0) ev.push({date:at(x.due), name:x.name, amt:-billAmt(x), kind:'bill'}); });
    state.debts.forEach(x => { if (x.due && x.balance > 0 && x.min > 0) ev.push({date:at(x.due), name:x.name + ' payment', amt:-x.min, kind:'debt'}); });
    (state.otherIncome || []).forEach(x => { if (x.day && x.amount > 0) ev.push({date:at(x.day), name:x.name, amt:x.amount, kind:'income'}); });
  }
  state.bills.forEach(x => { if (x.freq !== 'weekly' || !(x.days || []).length || !(billPer(x) > 0)) return;
    for (let d = from, g = 0; d <= to && g < 800; d = addDays(d, 1), g++){ if (x.days.includes(parseISO(d).getDay())) ev.push({date:d, name:x.name, amt:-billPer(x), kind:'bill'}); } });

    while (d < from && g++ < 200) d = addMonthsISO(d, step);

  if (opts.pay !== false && c.base > 0) paydaysIn(from, to).forEach(p => ev.push({date:p, name:'Paycheck', amt:c.base, kind:'pay'}));
  if (opts.moves){ const parts = payMoves(); const tot = sum(parts, x => x.amt);
    if (tot > 0) paydaysIn(from, to).forEach(p => ev.push({date:p, name:'Goal & debt moves', amt:-tot, kind:'moves', parts})); }
  return ev.filter(e => e.date >= from && e.date <= to).sort((p, q) => p.date.localeCompare(q.date) || (q.amt - p.amt));
}
function undated(){
  return {bills:state.bills.filter(x => (x.freq === 'weekly' ? !(x.days || []).length : !x.due) && billAmt(x) > 0), debts:state.debts.filter(x => !x.due && x.balance > 0 && x.min > 0),

}
function payMoves(){

function movesPerCheck(sim, c){

function cashflow(sim, c){

}

      state.owed.push({id:uid(), person:payer, amount:each, dir:'out', note, date:t, settled:false}); toast('You owe ' + payer + ' ' + money(each, true)); }
    else { const n = sel.length + (ui.splitMe !== false ? 1 : 0); const each = Math.round(total / n);
      sel.forEach(p => state.owed.push({id:uid(), person:p, amount:each, dir:'in', note, date:t, settled:false})); toast(sel.length + (sel.length === 1 ? ' person owes' : ' people owe') + ' you ' + money(each, true) + ' each'); }
    ui.splitSel = []; save(); render(); },
  splitMeToggle: () => {},
  owedDir: el => { ui.owedDir = el.dataset.v; el.parentNode.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === el ? 'true' : 'false')); },
  settleGroup: el => { const [dir, ...rest] = el.dataset.v.split(':'); const person = rest.join(':'); const items = state.owed.filter(o => !o.settled && o.dir === dir && o.person === person);
    snapOwed(items, 'All paid with ' + person); items.forEach(o => { o.settled = true; o.settledDate = todayISO(); }); save(); render(); },
  settleOwed: el => { const o = state.owed.find(x => x.id === el.dataset.id); if (!o) return; snapOwed([o], o.person + ' · ' + (o.note || 'item') + ' marked paid'); o.settled = true; o.settledDate = todayISO(); save(); render(); },
  undoOwed: () => { if (!ui.undo) return; ui.undo.items.forEach(s => { const o = state.owed.find(x => x.id === s.id); if (o){ Object.keys(o).forEach(k => { if (k !== 'id') delete o[k]; }); Object.assign(o, JSON.parse(s.json)); } }); ui.undo = null; save(); render(); toast('Undone'); },
  partialOpen: el => { ui.partial = el.dataset.v; ui.undo = null; render(); const i = document.getElementById('pp-amt'); if (i) i.focus(); },
  partialCancel: () => { ui.partial = null; render(); },
  partialSave: el => { const [dir, ...rest] = el.dataset.v.split(':'); const person = rest.join(':'); let a = parseMoney((document.getElementById('pp-amt') || {}).value);
    if (!a || a <= 0){ const i = document.getElementById('pp-amt'); if (i) i.focus(); toast('Enter the amount paid'); return; }
    const paidTotal = a; const t = todayISO(); const items = state.owed.filter(o => !o.settled && o.dir === dir && o.person === person).sort((p, q) => String(p.date).localeCompare(String(q.date)));
    snapOwed(items, '');
    items.forEach(o => { if (a <= 0) return; const take = Math.min(a, o.amount); if (o.orig == null) o.orig = o.amount; o.amount -= take; o.paid = (o.paid || []).concat([{date:t, amount:take}]); a -= take;
      if (o.amount <= 0){ o.amount = 0; o.settled = true; o.settledDate = t; } });
    const left = sum(state.owed.filter(o => !o.settled && o.dir === dir && o.person === person), o => o.amount);
    ui.undo.label = `Recorded ${money(paidTotal - a, true)} from ${person}. ${left ? money(left, true) + ' still ' + (dir === 'in' ? 'owed' : 'to pay') + '.' : 'All settled.'}${a > 0 ? ` ${money(a, true)} was more than owed.` : ''}`;
    ui.partial = null; save(); render(); },
  delOwed: el => armOrRun('owed-' + el.dataset.id, () => { state.owed = state.owed.filter(x => x.id !== el.dataset.id); save(); render(); }),
  makeBackup: () => { ui.backupCode = PREFIX + b64(JSON.stringify(state)); state.lastBackup = todayISO(); save(); render(); },
  copyBackup: () => { const ta = document.getElementById('backupOut'); const text = ui.backupCode;
    const fallback = () => { ta.focus(); ta.select(); toast('Selected. Use Copy from your keyboard or menu'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast('Backup code copied'), fallback); else fallback(); },
  restore: () => { const txt = (document.getElementById('restoreIn') || {}).value || '';
    if (!txt.trim()){ ui.restoreMsg = {ok:false, text:'Paste a backup code first.'}; ui.confirm = null; render(); return; }
    if (ui.confirm !== 'restore'){ ui.confirm = 'restore'; const keep = txt; render(); document.getElementById('restoreIn').value = keep; return; }
    ui.confirm = null;
    try { const code = txt.trim().replace(/\s+/g, ''); if (!code.startsWith(PREFIX)) throw new Error('That code doesn\'t start with ' + PREFIX + '. Check that the whole code was pasted.');
      const obj = JSON.parse(unb64(code.slice(PREFIX.length))); if (!obj || typeof obj !== 'object' || !obj.pay) throw new Error('That code is incomplete. Copy it again from the device that made it.');
      state = migrate(obj); save(); ui.restoreMsg = {ok:true, text:'Restored. Everything from the backup is back.'}; ui.backupCode = null; render(); toast('Backup restored');
    } catch (e){ ui.restoreMsg = {ok:false, text:e.message && e.message.length < 140 ? e.message : "That code couldn't be read. Copy it again from the device that made it."}; render(); document.getElementById('restoreIn').value = txt; } },
  welcomeRestore: () => { ui.welcomeRestore = !ui.welcomeRestore; ui.restoreMsg = null; render(); if (ui.welcomeRestore){ const t = document.getElementById('restoreIn'); if (t) t.focus(); } },
  restoreWelcome: () => { ui.confirm = 'restore'; ACT.restore(); if (state.setupDone){ ui.welcomeRestore = false; ui.tab = 'today'; render(); window.scrollTo(0, 0); } },
  redoSetup: () => { state.setupDone = false; state.setup = {path:'detailed', step:0}; save(); render(); window.scrollTo(0, 0); },
  erase: () => armOrRun('erase', () => { state = defaultState(); ui.tab = 'today'; ui.backupCode = null; save(); render(); window.scrollTo(0, 0); })
};
function chargeBill(b, total){
  const w = billWith(b); if (!w.length || !total) return 0; const each = othersOwe(b, total); const t = todayISO(); const label = b.name + ' · ' + MONTHS[new Date().getMonth()];
  w.forEach(p => state.owed.push({id:uid(), person:p, amount:each, dir:'in', note:label, date:t, settled:false}));
  b.charged = monthStartISO(0).slice(0, 7); return w.length;
}
function keepSplitInputs(fn){ const a = (document.getElementById('ow-amt') || {}).value, n = (document.getElementById('ow-note') || {}).value; ui.open.split = true; fn();
  const A = document.getElementById('ow-amt'), N = document.getElementById('ow-note'); if (A && a) A.value = a; if (N && n) N.value = n; const pv = document.getElementById('ow-preview'); if (pv) pv.innerHTML = splitPreview(); }
function snapOwed(items, label){ ui.undo = {label, items:items.map(o => ({id:o.id, json:JSON.stringify(o)}))}; }
function b64(str){ return btoa(unescape(encodeURIComponent(str))); }
function unb64(str){ return decodeURIComponent(escape(atob(str))); }

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (!a || a.disabled) return;
  const f = ACT[a.dataset.act]; if (!f) return;
  if (ui.confirm && !['rmRow','delLog','delGoal','delDebt','delOwed','restore','erase','startFresh','rmCut'].includes(a.dataset.act)) ui.confirm = null;
  e.preventDefault(); f(a, e);
});
let dirty = false;
function bindInput(el){
  const t = el.dataset.t; let v;
  if (t === 'money') v = parseMoney(el.value); else if (t === 'num') v = el.value === '' ? null : Number(String(el.value).replace(/[%,\s]/g, '')); else if (t === 'check') v = el.checked; else v = el.value;
  if (t === 'num' && v != null && !isFinite(v)) return;
  const b = el.dataset.b;
  const target = el.dataset.id ? (state[b] || []).find(x => x.id === el.dataset.id) : (b === 'root' ? state : state[b]);
  if (!target) return;
  target[el.dataset.f] = v;
  if (b === 'goals' && (el.dataset.f === 'date' || el.dataset.f === 'target')) setBase(target);
  if (b === 'veh' && el.dataset.f === 'fuelSync' && v && !gasCat()) state.everyday.push({id:uid(), name:'Gas', amount:0});
  save(); dirty = true; refreshLive();
}
document.addEventListener('input', e => { const el = e.target;
  if (el.tagName === 'INPUT' && el.closest && el.closest('.money')){
    const digits = el.value.replace(/\D/g, '').replace(/^0+/, '').slice(0, 11);
    el.value = digits ? mv(parseInt(digits, 10)) : '';
    try { const n = el.value.length; el.setSelectionRange(n, n); } catch (err) {}
  }
  if (el.id === 'cut-to'){ updateCutPreview(); return; }
  if (el.id === 'ow-amt'){ const pv = document.getElementById('ow-preview'); if (pv) pv.innerHTML = splitPreview(); return; }
  if (el.id && el.id.indexOf('sb-') === 0){ const b = state.bills.find(x => x.id === el.id.slice(3)); const out = document.getElementById('sbe-' + el.id.slice(3)); if (b && out) out.textContent = money(othersOwe(b, parseMoney(el.value) || 0), true); return; } if (el.dataset && el.dataset.b && el.type !== 'checkbox' && el.tagName !== 'SELECT') bindInput(el); });
document.addEventListener('change', e => { const el = e.target; if (el.id === 'cut-cat'){ ui.cutCat = el.value; render(); return; }
  if (el.id === 'ow-me'){ ui.splitMe = el.checked; const pv = document.getElementById('ow-preview'); if (pv) pv.innerHTML = splitPreview(); return; }
  if (el.id === 'ow-payer'){ ui.splitPayer = el.value; const pv = document.getElementById('ow-preview'); if (pv) pv.innerHTML = splitPreview(); return; } if (!el.dataset || !el.dataset.b) return; bindInput(el); if (el.dataset.rerender || el.type === 'checkbox' || el.tagName === 'SELECT'){ dirty = false; render(); } });
document.addEventListener('focusout', e => {
  const t = e.target;
  if (t && t.tagName === 'INPUT' && t.closest && t.closest('.money')){ const v = parseMoney(t.value); if (v != null) t.value = mv(v); }
  setTimeout(() => { const a = document.activeElement; const editing = a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName); if (dirty && !editing && state.setupDone && !ui.modal){ dirty = false; render(); } }, 60); });
document.addEventListener('toggle', e => { const d = e.target; if (d.matches && d.matches('details.sec')) ui.open[d.dataset.sec] = d.open; }, true);
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'logForm'){
    const amtEl = document.getElementById('logAmt'); const a = parseMoney(amtEl.value);
    if (!a || a <= 0){ amtEl.focus(); toast('Enter an amount'); return; }
    const date = document.getElementById('logDate').value || todayISO();
    state.log.push({id:uid(), date, amount:a, cat:ui.logCat || 'Other', note:document.getElementById('logNote').value.trim()});
    save(); render(); toast('Logged ' + money(a, true) + ' · ' + (ui.logCat || 'Other'));
    const n = document.getElementById('logAmt'); if (n) n.focus({preventScroll:true});
    return;
  }
  if (f.id === 'owedForm'){
    const person = document.getElementById('ow-person').value.trim(); const a = parseMoney(document.getElementById('ow-amt').value); const err = document.getElementById('ow-err');
    if (!person || !a || a <= 0){ err.textContent = 'Add who it is and the amount.'; err.hidden = false; return; }
    state.owed.push({id:uid(), person, amount:a, dir:ui.owedDir, note:document.getElementById('ow-note').value.trim(), date:todayISO(), settled:false});
    save(); render(); toast(ui.owedDir === 'in' ? person + ' owes you ' + money(a, true) : 'You owe ' + person + ' ' + money(a, true));
    return;
  }
  if (f.dataset.goalform){
    const k = f.dataset.goalform; const name = document.getElementById('gf-name-' + k).value.trim(); const target = parseMoney(document.getElementById('gf-target-' + k).value);
    const saved = parseMoney(document.getElementById('gf-saved-' + k).value) || 0; const mode = document.getElementById('gf-mode-' + k).value; const date = document.getElementById('gf-date-' + k).value;
    const err = document.getElementById('gf-err-' + k);
    if (!name || !target || target <= 0){ err.textContent = 'Give the goal a name and a target amount.'; err.hidden = false; return; }
    if (mode === 'date' && (!date || date <= todayISO())){ err.textContent = 'Pick a date in the future, or choose "As soon as possible."'; err.hidden = false; return; }
    if (k === 'new'){ const g = {id:uid(), name, target, saved, mode, date:mode === 'date' ? date : null, checkins:[]}; setBase(g); state.goals.push(g); ui.addGoal = false; toast('Goal added'); }
    else { const g = state.goals.find(x => x.id === k); Object.assign(g, {name, target, saved, mode, date:mode === 'date' ? date : null}); setBase(g); ui.editGoal = null; toast('Goal saved'); }
    normOrder(); save(); render(); return;
  }
  if (f.dataset.debtform){
    const k = f.dataset.debtform; const name = document.getElementById('df-name-' + k).value.trim(); const bal = parseMoney(document.getElementById('df-bal-' + k).value);
    const aprRaw = document.getElementById('df-apr-' + k).value.replace(/[%\s]/g, ''); const apr = aprRaw === '' ? 0 : Number(aprRaw); const min = parseMoney(document.getElementById('df-min-' + k).value) || 0; const dueV = document.getElementById('df-due-' + k).value; const due = dueV ? Number(dueV) : null;
    const err = document.getElementById('df-err-' + k);
    if (!name || bal == null || bal < 0 || !isFinite(apr)){ err.textContent = 'Add a name, a balance, and an interest rate (0 is fine).'; err.hidden = false; return; }
    if (k === 'new'){ state.debts.push({id:uid(), name, balance:bal, apr, min, due, payments:[]}); ui.addDebt = false; toast('Debt added'); }
    else { Object.assign(state.debts.find(x => x.id === k), {name, balance:bal, apr, min, due}); ui.editDebt = null; toast('Debt saved'); }
    normOrder(); save(); render(); return;
  }
});

if (state.setupDone){ normOrder(); ensureDay1(); }
render();
})();
</script>
